monitor:
  poll_interval_sec: 1.0
  stale_timeout_sec: 3.0
  hz_window_sec: 5.0

alerts:
  qos:
    # 서로 다른 Graph 갱신에서 연속 확인된 incompatible만 Alert로 승격합니다.
    incompatible_confirmation_count: 3

fastdds_observer:
  # Fast DDS Discovery 전용 Participant만 생성하며 Service/Action Client는 만들지 않습니다.
  enabled: true
  port: 8766
  poll_interval_sec: 0.5
  request_timeout_sec: 0.2

topics:
  auto_discover: true
  auto_subscribe_supported_types: true
  # 실제 Monitor Subscription이 수신한 lightweight preview의 Topic별 최대 보존 수입니다.
  history_limit: 100

  required_stream_names:
    - /imu
    - /joint_states
    - /odom
    - /scan

  command_names:
    - /cmd_vel
    - /cmd_vel_smoothed

  include_names: []

  exclude_names: []

  exclude_prefixes: []

  exclude_types:
    - rosgraph_msgs/msg/Clock
    - rcl_interfaces/msg/ParameterEvent
    - rcl_interfaces/msg/Log
    - tf2_msgs/msg/TFMessage

  supported_types:
    - sensor_msgs/msg/Image
    - sensor_msgs/msg/CompressedImage
    - sensor_msgs/msg/LaserScan
    - nav_msgs/msg/Odometry
    - sensor_msgs/msg/Imu
    - geometry_msgs/msg/Twist
    - geometry_msgs/msg/TwistStamped
    - sensor_msgs/msg/JointState
    - ros2_dashboard_interfaces/msg/MonitorStatus

  camera_preview:
    # Live Preview refreshes this lease while its detail is open. Closing the
    # detail clears it immediately; the TTL only recovers abandoned browsers.
    demand_ttl_sec: 3.0
    min_interval_sec: 0.1
    max_source_bytes: 4000000
    max_width: 1920
    max_height: 1080

services:
  # 순간 Discovery 누락을 장애로 확정하기 전 확인 시간입니다.
  graph_missing_timeout_sec: 5.0
  primary_names: []
  include_names: []
  exclude_names: []
  exclude_prefixes: []

  active_check:
    # 정책 메모:
    # Service 상태는 ROS2 Graph의 Server 존재 여부로 관찰하고,
    # 실제 요청/응답 확인은 Interface Lab의 사용자 명시 Call로 수행합니다.
    # 일반 Service의 주기적 자동 호출은 상태 변경이나 장비 동작을
    # 유발할 수 있으므로 사용하지 않습니다.
    enabled: false
    interval_sec: 5.0
    default_timeout_sec: 2.0
    allowlist: []

nodes:
  primary_names: []
  include_names: []
  exclude_names: []
  exclude_prefixes: []
  stale_timeout_sec: 5.0

actions:
  # 순간 Discovery 누락을 장애로 확정하기 전 확인 시간입니다.
  graph_missing_timeout_sec: 5.0
  # 실제 Monitor가 관찰한 Action Feedback/Status/Result의 Action별 최대 보존 수입니다.
  history_limit: 100
  primary_names: []
  include_names: []
  exclude_names: []
  exclude_prefixes: []
  auto_monitor_status: true
  auto_monitor_feedback: true
  auto_fetch_result_for_observed_goals: true
